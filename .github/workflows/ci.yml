name: ASSO Platform CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite (Unit, Integration & Critical Security)
        run: npm test

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asso_dev
          JWT_SECRET: super-secret-ci-testing-jwt-key-minimum-32-chars-long
